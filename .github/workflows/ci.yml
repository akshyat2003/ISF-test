name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04            # pinned: ubuntu-latest moves to 26.04 from 19 Oct 2026
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_AUTH_MODE: dev
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5          # version from package.json "packageManager"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - name: API integration tests (real Postgres, fresh database per file)
        run: pnpm --filter @sj/api test
      - name: Mobile unit tests (keychain session storage)
        run: pnpm --filter @sj/mobile test
      - run: pnpm -r build
      - name: Mobile bundle (Metro, web target; catches import and bundling errors)
        run: pnpm --filter @sj/mobile export:web
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
